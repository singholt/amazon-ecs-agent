name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z-A format, e.g., 1.102.0-1)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Invalid version format '${VERSION}'. Expected X.Y.Z-A (e.g., 1.102.0-1)"
            exit 1
          fi
          AGENT_VERSION="${VERSION%-*}"
          RELEASE_NUMBER="${VERSION##*-}"
          echo "AGENT_VERSION=$AGENT_VERSION" >> $GITHUB_ENV
          echo "RELEASE_NUMBER=$RELEASE_NUMBER" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/checkout@v6
        with:
          submodules: true
          # Fetch all history for all tags and branches
          fetch-depth: 0

      - name: Check if release tag already exists
        run: |
          echo "Checking if release tag v${AGENT_VERSION} already exists..."
          HTTP_STATUS=$(curl -s -o /tmp/release_response.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${AGENT_VERSION}")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "::error::Version ${AGENT_VERSION} has already been released (tag v${AGENT_VERSION} exists)"
            exit 1
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "Tag v${AGENT_VERSION} does not exist. Proceeding."
          else
            echo "::error::Unexpected response from GitHub API (HTTP $HTTP_STATUS)"
            cat /tmp/release_response.json
            exit 1
          fi

      - name: Fetch master branch
        run: |
          git fetch origin master:master

      - name: Create staging branch
        run: |
          BRANCH_NAME="v${AGENT_VERSION}-stage"
          git checkout -b "$BRANCH_NAME" origin/dev
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Staging branch: $BRANCH_NAME at $COMMIT_SHA"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Generate changelog
        run: |
          scripts/generate-release-changelog.sh --agent-version "$AGENT_VERSION"

      - name: Update VERSION file
        run: |
          echo "$AGENT_VERSION" > VERSION

      - name: get GO_VERSION
        id: get-go-version
        run: |
          set -eou pipefail
          go_version=$(cat -e GO_VERSION)
          go_version=${go_version%?}
          go_version_length=${#go_version}
          go_version_re="^([0-9]+\.){1,2}([0-9]+)$"
          if ! [[ $go_version_length -le 10 && $go_version =~ $go_version_re ]] ; then
            echo "::error::Invalid GO version in GO_VERSION file"
            exit 1
          fi
          echo "GO_VERSION=$go_version" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.get-go-version.outputs.GO_VERSION }}
          cache: false

      - name: Generate version.go
        env:
          GOPROXY: direct
        run: |
          cd agent/version
          GO111MODULE=off go run gen/version-gen.go

      - name: Update CHANGELOG_MASTER
        run: |
          CHANGELOG_MASTER="scripts/changelog/CHANGELOG_MASTER"
          TIMESTAMP="$(date +%Y-%m-%d)T10:00:00-08:00"

          # Prepend new entry to CHANGELOG_MASTER
          {
            printf '%s\n' "${VERSION}"
            printf '%s\n' "amazon-ecs-bot <amazon-ecs-bot@amazon.com>"
            printf '%s\n' "${TIMESTAMP}"
            printf '%s\n' "Cache Agent version ${AGENT_VERSION}"
            printf '\n'
            cat "$CHANGELOG_MASTER"
          } > "${CHANGELOG_MASTER}.tmp"
          mv "${CHANGELOG_MASTER}.tmp" "$CHANGELOG_MASTER"

      - name: Run ECS init changelog script
        run: |
          cd scripts/changelog
          GO111MODULE=off go run changelog.go

      - name: Update versions in the ECS init spec files
        run: |
          sed -i "s/^Version:[[:space:]]*.*/Version:        ${AGENT_VERSION}/" \
            packaging/amazon-linux-ami-integrated/ecs-agent.spec
          sed -i "s/^Version:[[:space:]]*.*/Version:        ${AGENT_VERSION}/" \
            packaging/generic-rpm-integrated/amazon-ecs-init.spec
      
      - name: Update vendor list in spec files
        run: |
          ./scripts/update-spec-vendor-list.sh

      - name: Update default agent version in ECS init's config
        run: |
          sed -i "s/DefaultAgentVersion = \"v[0-9.]*\"/DefaultAgentVersion = \"v${AGENT_VERSION}\"/" \
            ecs-init/config/common.go

      - name: Update ECSVERSION file
        run: |
          echo "$AGENT_VERSION" > ecs-init/ECSVERSION

      - name: Update submodules
        run: |
          git submodule update --init

      - name: Commit changes
        run: |
          git add -A
          git config user.name "amazon-ecs-bot"
          git config user.email "amazon-ecs-bot@amazon.com"
          git commit -m "Release ${AGENT_VERSION}"

      - name: Push staging branch to origin
        run: |
          echo "Pushing branch ${BRANCH_NAME} to origin..."
          git push --force --set-upstream origin "${BRANCH_NAME}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.ECS_AGENT_WORKFLOW_SECRET }}
        run: |
          # Build PR body with release title and licensing section
          PR_BODY=$(cat <<EOF
          ### Summary
          Release ${AGENT_VERSION}

          ### Licensing

          By submitting this pull request, I confirm that my contribution is made under the terms of the Apache 2.0 license.
          EOF
          )

          # Create PR using GitHub REST API
          PR_RESPONSE=$(curl -s -w "\n%{http_code}" -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "$(jq -n \
              --arg title "Release ${AGENT_VERSION}" \
              --arg body "$PR_BODY" \
              --arg head "${BRANCH_NAME}" \
              --arg base "dev" \
              '{title: $title, body: $body, head: $head, base: $base}')")

          # Separate response body and HTTP status code
          HTTP_STATUS=$(echo "$PR_RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$PR_RESPONSE" | sed '$d')

          # Ref: https://docs.github.com/en/rest/pulls/pulls?apiVersion=2022-11-28#create-a-pull-request
          if [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::Failed to create pull request (HTTP ${HTTP_STATUS})"
            echo "$RESPONSE_BODY" | jq . 2>/dev/null || echo "$RESPONSE_BODY"
            exit 1
          fi

          PR_NUMBER=$(echo "$RESPONSE_BODY" | jq -r '.number')
          PR_URL=$(echo "$RESPONSE_BODY" | jq -r '.html_url')

          if [ "$PR_NUMBER" = "null" ] || [ -z "$PR_NUMBER" ]; then
            echo "::error::PR creation response did not contain a valid PR number"
            echo "$RESPONSE_BODY" | jq . 2>/dev/null || echo "$RESPONSE_BODY"
            exit 1
          fi

          echo "Pull request created successfully"
          echo "PR Number: ${PR_NUMBER}"
          echo "PR URL: ${PR_URL}"